<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;
    
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    
        /* Top Bar */
        .topbar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
            background: #333;
            color: white;
            box-sizing: border-box;
        }

        .right-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .username {
            font-weight: bold;
        }

        .logout-btn {
            background: red;
            border: none;
            padding: 8px 20px;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 0;
        }    

        /* Main Container */
        .container {
            width: 80%;
            max-width: 900px;
            text-align: center;
            margin-top: 30px;
        }
    
        h2 {
            margin-top: 30px;
        }
        #imageInput::file-selector-button {
            padding: 8px 15px;
            border: 1px solid #000;
            background: #7a82f5;
            color: #f4f4f4;
            border-radius: 3px;
            cursor: pointer;
        }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 120px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            margin-top: 10px;
        }
    
        .grid img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 5px;
            cursor: grab;
        }
    
        .dropzone {
            border: 2px dashed #555;
            min-height: 150px;
        }
    
        .start-btn {
            margin-top: 25px;
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    
    </style>
</head>

<body>

<!-- Top Bar -->
<div class="topbar">
    <h3>Image_Gallery</h3>

    <div class="right-section">
        <span class="username">{{ username }}</span>

        <form action="/logout">
            <button class="logout-btn">Logout</button>
        </form>
    </div>
</div>

<div class="container">

    <!-- Select Images -->
    <h2>Select Images</h2>
    <input type="file" id="imageInput" multiple accept="image/*">

    <!-- Gallery -->
    <h2>Gallery</h2>
    <div id="gallery" class="grid"></div>

    <!-- Slideshow Area -->
    <h2>Slideshow</h2>
    <div id="slideshowArea" class="grid dropzone"></div>

    <!-- Start Button -->
    <button class="start-btn" onclick="startSlideshow()">Start Slideshow</button>
    
    <!-- View Saved Slideshow Button -->
    <a href="/slideshow" style="text-decoration: none; color:black;">
        <button class="start-btn">View Slideshow</button>
    </a>
</div>


<script>
    let slideshowImages = [];
    
    //Load gallery from database
    function loadGallery() {
        fetch("/get_gallery")
        .then(res => res.json())
        .then(images => {
            let gallery = document.getElementById("gallery");
            gallery.innerHTML = "";
    
            images.forEach(obj => {
                let img = document.createElement("img");
                let fullUrl = window.location.origin + obj.url;
                img.src = fullUrl;

                img.draggable = true;

                img.ondragstart = (e) => {
                let fullUrl = window.location.origin + obj.url;
                e.dataTransfer.setData("url", fullUrl);
                };

                // DOUBLE CLICK DELETE FROM DB
                img.ondblclick = () => {
                    if (confirm("Delete this image?")) {
                        fetch(`/delete_image/${obj.id}`, {
                            method: "DELETE"
                        })
                        .then(res => res.json())
                        .then(() => loadGallery());
                    }
                };

                gallery.appendChild(img);
            });
        });
    }
    
    // Upload images to server
    document.getElementById("imageInput").addEventListener("change", function(e) {
        const files = e.target.files;
    
        for (let file of files) {
            let formData = new FormData();
            formData.append("image", file);
    
            fetch("/upload", {
                method: "POST",
                body: formData
            })
            .then(res => res.text())
            .then(() => loadGallery());
        }
    });
    
    let dropzone = document.getElementById("slideshowArea");
    
    dropzone.ondragover = (e) => {
        e.preventDefault();
    };
    
    dropzone.ondrop = (e) => {
        e.preventDefault();
    
        let url = e.dataTransfer.getData("url");
    
        slideshowImages.push(url);
        renderSlideshow();
    };
    
    
    //Render Slideshow Page
    function renderSlideshow() {
        dropzone.innerHTML = "";
    
        slideshowImages.forEach((url, index) => {
            let img = document.createElement("img");
            img.src = url;
            img.draggable = true;
    
            img.ondragstart = (e) => {
                e.dataTransfer.setData("index", index);
            };
    
            img.ondragover = (e) => e.preventDefault();
    
            img.ondrop = (e) => {
                e.preventDefault();
    
                let fromIndex = e.dataTransfer.getData("index");
                let toIndex = index;
    
                let temp = slideshowImages[fromIndex];
                slideshowImages[fromIndex] = slideshowImages[toIndex];
                slideshowImages[toIndex] = temp;
    
                renderSlideshow();
            };
    
            // double click delete
            img.ondblclick = () => {
                slideshowImages.splice(index, 1);
                renderSlideshow();
            };
    
            dropzone.appendChild(img);
        });
    }
    
    
    // Start Slideshow
    function startSlideshow() {
        if (slideshowImages.length === 0) {
            alert("No images in slideshow!");
            return;
        }
    
        localStorage.setItem("slideshow", JSON.stringify(slideshowImages));
    
        window.location.href = "/slideshow";
    }
    
    window.onload = loadGallery;
    
    </script>
    
</body>
</html>
